[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-backtesting-lab"
version = "0.1.0"
description = "Leakage-audited, CPU-first factor research and walk-forward backtesting laboratory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.25,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
ml = ["lightgbm>=4.1"]
test = ["pytest>=7.4"]
qlib = ["pyqlib>=0.9"]
audit = ["pypdf>=5,<8", "requests>=2.31", "pyarrow>=15"]

[project.scripts]
quant-lab = "quant_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
