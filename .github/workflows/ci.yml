name: CPU baseline validation
on:
  push:
  pull_request:
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Install CPU dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -q
      - name: Run synthetic smoke (not a live-market claim)
        run: python -m quant_lab.cli demo --model ridge --days 130 --assets 5 --train-days 35 --validation-days 10 --test-days 10 --output runs/ci_smoke
